<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightPress - Prueba rápida</title>
  <style>
    :root {
      --primary-bg: #abd6f3;
      --board-bg: #eaf5ff;
      --element-block: #fde68a;
      --btn-off: #fde68a;
      --btn-on: #f59e0b;
      --border-main: #000;
      --success: #22c55e;
      --danger: #ef4444;
      --shadow: 0 28px 70px rgba(14, 30, 37, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--primary-bg);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: var(--border-main);
      padding: 2rem 1rem 3rem;
    }

    .app-container {
      width: min(100%, 1200px);
      margin: 0 auto;
    }

    .game-header {
      margin-bottom: 2rem;
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border: 2px solid var(--border-main);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: var(--shadow);
    }

    .brand h1 { margin: 0; font-size: clamp(1.8rem, 2.4vw, 2.4rem); letter-spacing: 0.08rem; }
    .user-stats { display: flex; gap: 1.8rem; font-weight: 700; text-transform: uppercase; justify-content: center; flex: 1; }
    .header-actions { display: flex; gap: 0.75rem; }
    .icon-btn {
      width: 2.4rem; height: 2.4rem; border: 2px solid var(--border-main);
      background: var(--element-block); font-weight: 700; display: inline-flex;
      align-items: center; justify-content: center; transform: rotate(45deg); border-radius: 0.45rem;
    }
    .icon-btn span { transform: rotate(-45deg); display: inline-block; }

    .game-area { display: flex; gap: 2rem; align-items: flex-start; }
    .game-sidebar { width: 250px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.5rem; }
    .mode-block, .score-block {
      min-height: 250px; background: var(--element-block); border: 2px solid var(--border-main);
      border-radius: 24px; padding: 1.5rem; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .sidebar-label { margin: 0 0 0.5rem; font-weight: 800; font-size: 0.78rem; letter-spacing: 0.08rem; text-transform: uppercase; }
    .mode-block h2 { margin: 0; }
    .mode-actions { width: 100%; display: grid; gap: 0.7rem; margin: 1.2rem 0; }
    button { font: inherit; }
    .mode-btn, .main-action-btn {
      width: 100%; border: 2px solid var(--border-main); border-radius: 14px; padding: 0.75rem 1rem;
      font-weight: 900; cursor: pointer; background: rgba(255,255,255,.9); color: var(--border-main);
    }
    .mode-btn.selected, .main-action-btn { background: var(--btn-on); }
    .mode-btn:disabled { cursor: not-allowed; opacity: .75; }
    .score-value { font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1; margin: .3rem 0 1.1rem; }
    .stats-grid { display: grid; grid-template-columns: 1fr auto; gap: .5rem 1rem; width: 100%; text-align: left; font-size: .95rem; }
    .stats-grid strong { text-align: right; }

    .play-section { flex: 1; min-width: 0; }
    .game-status-card {
      max-width: 760px; margin-bottom: 1rem; padding: 1rem 1.2rem; border: 2px solid var(--border-main);
      border-radius: 20px; background: rgba(255,255,255,.88); box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .game-status-card p, .game-status-card h2 { margin: 0; }
    .eyebrow { font-size: .75rem; font-weight: 900; letter-spacing: .1rem; text-transform: uppercase; }
    .status-pill { min-width: 76px; padding: .55rem .8rem; border: 2px solid var(--border-main); border-radius: 999px; background: var(--element-block); text-align: center; font-weight: 900; }
    .progress-track { max-width: 760px; height: 16px; border: 2px solid var(--border-main); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.75); margin-bottom: 1rem; }
    .progress-fill { height: 100%; width: 0%; background: var(--btn-on); transition: width .12s linear; }

    .board-container {
      background: var(--board-bg); border-radius: 24px; padding: 3rem; box-shadow: var(--shadow);
      border: 2px solid rgba(0,0,0,.2); display: grid; grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(3, minmax(80px, auto)); gap: 1.5rem; max-width: 760px;
      justify-items: center; align-items: center;
    }
    .board-container > .pop-btn { grid-column: span 2; }
    .board-container > .pop-btn:nth-child(1) { grid-column-start: 1; }
    .board-container > .pop-btn:nth-child(2) { grid-column-start: 3; }
    .board-container > .pop-btn:nth-child(3) { grid-column-start: 5; }
    .board-container > .pop-btn:nth-child(4) { grid-column-start: 7; }
    .board-container > .pop-btn:nth-child(5) { grid-column-start: 2; }
    .board-container > .pop-btn:nth-child(6) { grid-column-start: 4; }
    .board-container > .pop-btn:nth-child(7) { grid-column-start: 6; }
    .board-container > .pop-btn:nth-child(8) { grid-column-start: 1; grid-row-start: 3; }
    .board-container > .pop-btn:nth-child(9) { grid-column-start: 3; grid-row-start: 3; }
    .board-container > .pop-btn:nth-child(10) { grid-column-start: 5; grid-row-start: 3; }
    .board-container > .pop-btn:nth-child(11) { grid-column-start: 7; grid-row-start: 3; }

    .pop-btn {
      width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--border-main);
      cursor: pointer; transition: .18s ease-in-out; background: var(--btn-off); color: var(--border-main);
      font-weight: 900; font-size: 1.05rem; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12);
    }
    .pop-btn:disabled { cursor: not-allowed; }
    .pop-btn.on { background: var(--btn-on); box-shadow: 0 0 24px rgba(245,158,11,.95), 0 0 58px rgba(245,158,11,.45); transform: scale(1.08); }
    .pop-btn.feedback-correct { background: var(--success); box-shadow: 0 0 22px rgba(34,197,94,.8); transform: scale(1.12); }
    .pop-btn.feedback-wrong { background: var(--danger); box-shadow: 0 0 22px rgba(239,68,68,.8); transform: scale(.92); }

    @media (max-width: 920px) {
      .game-header, .game-area { flex-direction: column; }
      .game-sidebar { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .game-status-card, .progress-track, .board-container { width: 100%; max-width: none; }
    }
    @media (max-width: 640px) {
      .game-sidebar { grid-template-columns: 1fr; }
      .board-container { padding: 1.2rem; gap: .8rem; }
      .pop-btn { width: 58px; height: 58px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="game-header">
      <div class="brand"><h1>LightPress</h1></div>
      <div class="user-stats"><span>Usuario: Eduardo_Dev</span><span>Monedas: <span id="coins">0</span></span></div>
      <div class="header-actions"><div class="icon-btn"><span>x</span></div><div class="icon-btn"><span>co</span></div></div>
    </header>

    <main class="game-area">
      <aside class="game-sidebar">
        <div class="mode-block">
          <p class="sidebar-label">Modo de juego</p>
          <h2>LightPress</h2>
          <div class="mode-actions">
            <button type="button" id="classicMode" class="mode-btn selected">Clásico</button>
            <button type="button" id="memoryMode" class="mode-btn">Memoria</button>
          </div>
          <button type="button" id="mainAction" class="main-action-btn">Iniciar</button>
        </div>

        <div class="score-block">
          <p class="sidebar-label">Puntuación</p>
          <strong class="score-value" id="score">0</strong>
          <div class="stats-grid">
            <span>Nivel</span><strong id="level">1</strong>
            <span>Vidas</span><strong id="lives">♥♥♥</strong>
            <span>Combo</span><strong id="combo">0</strong>
            <span>Secuencia</span><strong id="sequenceLength">0</strong>
          </div>
        </div>
      </aside>

      <section class="play-section">
        <div class="game-status-card">
          <div><p class="eyebrow">Estado</p><h2 id="message">Selecciona un modo y presiona iniciar.</h2></div>
          <div class="status-pill" id="statusPill">3.0s</div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="board-container" id="board"></div>
      </section>
    </main>
  </div>

  <script>
    const BUTTON_COUNT = 11;
    const MAX_LIVES = 3;
    const CLASSIC_START_TIME = 3000;
    const MIN_CLASSIC_TIME = 1200;
    const MEMORY_SHOW_TIME = 650;
    const MEMORY_PAUSE_TIME = 250;

    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const comboEl = document.getElementById('combo');
    const messageEl = document.getElementById('message');
    const statusPill = document.getElementById('statusPill');
    const progressFill = document.getElementById('progressFill');
    const sequenceLengthEl = document.getElementById('sequenceLength');
    const classicMode = document.getElementById('classicMode');
    const memoryMode = document.getElementById('memoryMode');
    const mainAction = document.getElementById('mainAction');

    let mode = 'classic';
    let isRunning = false;
    let score = 0;
    let level = 1;
    let lives = MAX_LIVES;
    let combo = 0;
    let activeButton = null;
    let lockedBoard = true;
    let timeLeft = CLASSIC_START_TIME;
    let timer = null;
    let sequenceTimers = [];
    let sequence = [];
    let playerStep = 0;

    function createButtons() {
      board.innerHTML = '';
      for (let id = 0; id < BUTTON_COUNT; id++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'pop-btn off';
        button.dataset.buttonId = String(id);
        button.textContent = id;
        button.disabled = true;
        button.addEventListener('click', () => handlePress(id));
        board.appendChild(button);
      }
    }

    function getRandomButton(exclude = null) {
      let next = Math.floor(Math.random() * BUTTON_COUNT);
      while (BUTTON_COUNT > 1 && next === exclude) next = Math.floor(Math.random() * BUTTON_COUNT);
      return next;
    }

    function getRoundTime() {
      return Math.max(MIN_CLASSIC_TIME, CLASSIC_START_TIME - ((level - 1) * 180));
    }

    function clearTimers() {
      clearInterval(timer);
      timer = null;
      sequenceTimers.forEach(clearTimeout);
      sequenceTimers = [];
    }

    function resetState() {
      clearTimers();
      isRunning = false;
      score = 0;
      level = 1;
      lives = MAX_LIVES;
      combo = 0;
      activeButton = null;
      lockedBoard = true;
      timeLeft = CLASSIC_START_TIME;
      sequence = [];
      playerStep = 0;
      mainAction.textContent = 'Iniciar';
      updateUI('Selecciona un modo y presiona iniciar.');
    }

    function updateUI(message) {
      scoreEl.textContent = score;
      coinsEl.textContent = score;
      levelEl.textContent = level;
      livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(MAX_LIVES - lives);
      comboEl.textContent = combo;
      sequenceLengthEl.textContent = sequence.length;
      messageEl.textContent = message;
      statusPill.textContent = mode === 'classic' ? `${(timeLeft / 1000).toFixed(1)}s` : `${playerStep}/${sequence.length}`;
      const progress = mode === 'classic'
        ? Math.max(0, Math.min(100, (timeLeft / getRoundTime()) * 100))
        : sequence.length ? Math.max(0, Math.min(100, (playerStep / sequence.length) * 100)) : 0;
      progressFill.style.width = `${progress}%`;
      document.querySelectorAll('.pop-btn').forEach((btn) => {
        const id = Number(btn.dataset.buttonId);
        btn.classList.toggle('on', id === activeButton);
        btn.classList.toggle('off', id !== activeButton);
        btn.disabled = !isRunning || lockedBoard;
      });
      classicMode.classList.toggle('selected', mode === 'classic');
      memoryMode.classList.toggle('selected', mode === 'memory');
      classicMode.disabled = isRunning;
      memoryMode.disabled = isRunning;
    }

    function feedback(id, type) {
      const btn = document.querySelector(`[data-button-id="${id}"]`);
      if (!btn) return;
      btn.classList.add(`feedback-${type}`);
      setTimeout(() => btn.classList.remove(`feedback-${type}`), 280);
    }

    function finishGame(message) {
      clearTimers();
      isRunning = false;
      lockedBoard = true;
      activeButton = null;
      mainAction.textContent = 'Reiniciar';
      updateUI(message);
    }

    function startGame() {
      clearTimers();
      isRunning = true;
      score = 0;
      level = 1;
      lives = MAX_LIVES;
      combo = 0;
      mainAction.textContent = 'Reiniciar';
      if (mode === 'classic') startClassic();
      else startMemory();
    }

    function startClassic() {
      activeButton = getRandomButton();
      timeLeft = getRoundTime();
      lockedBoard = false;
      updateUI('¡Presiona el botón encendido!');
      timer = setInterval(() => {
        timeLeft -= 100;
        if (timeLeft <= 0) {
          clearInterval(timer);
          lives -= 1;
          combo = 0;
          activeButton = null;
          lockedBoard = true;
          if (lives <= 0) return finishGame('Se terminó el tiempo y no quedan vidas.');
          updateUI('Se terminó el tiempo. Pierdes una vida.');
          setTimeout(nextClassicRound, 400);
          return;
        }
        updateUI('¡Presiona el botón encendido!');
      }, 100);
    }

    function nextClassicRound(previous = activeButton) {
      clearInterval(timer);
      activeButton = getRandomButton(previous);
      timeLeft = getRoundTime();
      lockedBoard = false;
      updateUI('¡Presiona el botón encendido!');
      startClassicTimerOnly();
    }

    function startClassicTimerOnly() {
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft -= 100;
        if (timeLeft <= 0) {
          clearInterval(timer);
          lives -= 1;
          combo = 0;
          activeButton = null;
          lockedBoard = true;
          if (lives <= 0) return finishGame('Se terminó el tiempo y no quedan vidas.');
          updateUI('Se terminó el tiempo. Pierdes una vida.');
          setTimeout(nextClassicRound, 400);
          return;
        }
        updateUI('¡Presiona el botón encendido!');
      }, 100);
    }

    function startMemory() {
      sequence = [getRandomButton()];
      playerStep = 0;
      activeButton = null;
      lockedBoard = true;
      updateUI('Observa la secuencia...');
      setTimeout(() => showSequence(), 350);
    }

    function showSequence() {
      lockedBoard = true;
      playerStep = 0;
      activeButton = null;
      updateUI('Observa la secuencia...');
      sequence.forEach((id, index) => {
        const on = setTimeout(() => { activeButton = id; updateUI('Observa la secuencia...'); }, index * (MEMORY_SHOW_TIME + MEMORY_PAUSE_TIME));
        const off = setTimeout(() => { activeButton = null; updateUI('Observa la secuencia...'); }, index * (MEMORY_SHOW_TIME + MEMORY_PAUSE_TIME) + MEMORY_SHOW_TIME);
        sequenceTimers.push(on, off);
      });
      const unlock = setTimeout(() => {
        lockedBoard = false;
        updateUI('Ahora repite la secuencia.');
      }, sequence.length * (MEMORY_SHOW_TIME + MEMORY_PAUSE_TIME) + 120);
      sequenceTimers.push(unlock);
    }

    function handlePress(id) {
      if (!isRunning || lockedBoard) return;
      if (mode === 'classic') handleClassicPress(id);
      else handleMemoryPress(id);
    }

    function handleClassicPress(id) {
      if (id !== activeButton) {
        lives -= 1;
        combo = 0;
        feedback(id, 'wrong');
        if (lives <= 0) return finishGame('Te quedaste sin vidas. Juego terminado.');
        updateUI('Botón incorrecto. Pierdes una vida.');
        return;
      }
      const previous = activeButton;
      clearInterval(timer);
      combo += 1;
      if (combo % 5 === 0) level += 1;
      const points = 10 + level * 2 + Math.floor(combo / 3);
      score += points;
      feedback(id, 'correct');
      lockedBoard = true;
      activeButton = null;
      updateUI(`Correcto +${points} puntos.`);
      setTimeout(() => nextClassicRound(previous), 350);
    }

    function handleMemoryPress(id) {
      const expected = sequence[playerStep];
      if (id !== expected) {
        lives -= 1;
        combo = 0;
        feedback(id, 'wrong');
        lockedBoard = true;
        if (lives <= 0) return finishGame('Fallaste la secuencia y te quedaste sin vidas.');
        updateUI('Botón incorrecto. Se repetirá la secuencia.');
        setTimeout(showSequence, 700);
        return;
      }
      feedback(id, 'correct');
      playerStep += 1;
      if (playerStep < sequence.length) {
        updateUI(`Bien. Siguiente paso ${playerStep + 1}/${sequence.length}.`);
        return;
      }
      combo += 1;
      level += 1;
      const points = 25 + sequence.length * 10 + combo * 3;
      score += points;
      sequence.push(getRandomButton(sequence[sequence.length - 1]));
      lockedBoard = true;
      playerStep = 0;
      updateUI(`Secuencia completada +${points} puntos. Nivel ${level}.`);
      setTimeout(showSequence, 900);
    }

    classicMode.addEventListener('click', () => { mode = 'classic'; resetState(); updateUI('Modo clásico: presiona el botón encendido antes de que se acabe el tiempo.'); });
    memoryMode.addEventListener('click', () => { mode = 'memory'; resetState(); updateUI('Modo memoria: observa la secuencia y repítela en el mismo orden.'); });
    mainAction.addEventListener('click', startGame);

    createButtons();
    updateUI('Selecciona un modo y presiona iniciar.');
  </script>
</body>
</html>
